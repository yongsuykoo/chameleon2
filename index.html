        // ============================================================================
        // 2. WEB AUDIO SYNTHESIZER ENGINE
        // ============================================================================
        class AudioSynthesizer {
            constructor() { this.ctx = null; }
            
            init() { 
                try {
                    if (!this.ctx) {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)(); 
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } catch (e) {
                    console.log('Audio Context initialize notice:', e);
                }
            }
            
            playDialClick() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.04);
                } catch (e) { console.log('Audio feedback bypass:', e); }
            }

            playPttBeep() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch (e) { console.log('Audio feedback bypass:', e); }
            }
        }

        const audioSynth = new AudioSynthesizer();

        // ============================================================================
        // 3. LEAFLET MAP VIEW COMPONENT (WITH RESILIENT RADAR FALLBACK)
        // ============================================================================
        function DynamicMapView({ workspace, appTheme, themeStyles }) {
            const mapContainerRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const [mapError, setMapError] = useState(false);

            useEffect(() => {
                if (!mapContainerRef.current || !workspace) return;

                if (mapInstanceRef.current) {
                    try {
                        mapInstanceRef.current.remove();
                    } catch (e) { console.log('Map cleanup notice:', e); }
                    mapInstanceRef.current = null;
                }

                if (typeof L === 'undefined') {
                    setMapError(true);
                    return;
                }

                try {
                    setMapError(false);
                    const tileUrl = appTheme === 'light'
                        ? 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
                        : 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png';

                    const map = L.map(mapContainerRef.current, {
                        center: workspace.mapCenter || [10.3157, 123.8854],
                        zoom: 13,
                        zoomControl: false
                    });

                    L.tileLayer(tileUrl, { attribution: '&copy; OpenStreetMap' }).addTo(map);

                    const customIcon = L.divIcon({
                        className: 'custom-map-pin',
                        html: `<div style="background-color: ${workspace.color}; width: 28px; height: 28px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 16px ${workspace.color}; display:flex; align-items:center; justify-content:center; color:white; font-size:12px;"><i class="fa-solid ${workspace.icon || 'fa-location-dot'}"></i></div>`,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });

                    L.marker(workspace.mapCenter, { icon: customIcon })
                        .addTo(map)
                        .bindPopup(`<b>${workspace.name}</b><br>${workspace.locationSubtitle}`)
                        .openPopup();

                    mapInstanceRef.current = map;

                    setTimeout(() => {
                        if (mapInstanceRef.current) {
                            try { mapInstanceRef.current.invalidateSize(); } catch(e){}
                        }
                    }, 300);
                } catch (err) {
                    console.error("Leaflet map init notice:", err);
                    setMapError(true);
                }

                return () => {
                    if (mapInstanceRef.current) {
                        try { mapInstanceRef.current.remove(); } catch(e){}
                        mapInstanceRef.current = null;
                    }
                };
            }, [workspace, appTheme]);

            if (mapError) {
                return (
                    <div className={`relative w-full h-64 md:h-80 rounded-2xl overflow-hidden border p-4 flex flex-col justify-between shadow-inner ${themeStyles.subPanelBg}`}>
                        <div className="flex justify-between items-center z-10 p-2 rounded-xl border border-slate-700/50 bg-slate-900/90 text-white">
                            <div className="flex items-center space-x-2">
                                <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: workspace?.color || '#00BCD4' }}></span>
                                <span className="font-bold text-xs">{workspace?.name || 'Spatial Telematics'} Radar</span>
                            </div>
                            <span className="text-[10px] bg-cyan-950 text-cyan-400 font-bold px-2 py-0.5 rounded-full border border-cyan-800">GPS TELEMATICS RADAR</span>
                        </div>
                        <div className="absolute inset-0 flex items-center justify-center opacity-30 pointer-events-none">
                            <svg className="w-full h-full" viewBox="0 0 400 250">
                                <defs>
                                    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                                        <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 188, 212, 0.3)" strokeWidth="1"/>
                                    </pattern>
                                </defs>
                                <rect width="100%" height="100%" fill="url(#grid)" />
                                <circle cx="200" cy="125" r="80" fill="none" stroke="rgba(0, 188, 212, 0.4)" strokeDasharray="4 4" />
                                <circle cx="200" cy="125" r="40" fill="none" stroke="rgba(0, 188, 212, 0.5)" />
                            </svg>
                        </div>
                        <div className="relative z-10 my-auto text-center">
                            <div className="w-12 h-12 rounded-full mx-auto flex items-center justify-center text-white text-xl mb-2 animate-bounce shadow-lg" style={{ backgroundColor: workspace?.color || '#00BCD4' }}>
                                <i className={`fa-solid ${workspace?.icon || 'fa-location-dot'}`}></i>
                            </div>
                            <h4 className="font-bold text-sm">{workspace?.name} Node Live</h4>
                            <p className="text-xs opacity-75 mt-0.5">{workspace?.locationSubtitle}</p>
                            <div className="mt-2 inline-flex items-center space-x-1.5 bg-slate-900/90 text-cyan-400 px-3 py-1 rounded-full text-[10px] font-bold border border-cyan-500/30">

                                <span>Coords: {workspace?.mapCenter ? `${workspace.mapCenter[0]}, ${workspace.mapCenter[1]}` : '10.3157, 123.8854'}</span>

        // ============================================================================
        // 4. IN-CHAT MEME EXPRESS GENERATOR MODAL
        // ============================================================================
        function MemeModal({ isOpen, onClose, onSendMeme, themeStyles }) {
            const [topText, setTopText] = useState('WHEN CONTEXT');
            const [bottomText, setBottomText] = useState('SWITCHES INSTANTLY');
            const canvasRef = useRef(null);

            useEffect(() => {
                if (!isOpen || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#005CE6'; // GCash Signature Blue
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#00D2FF';
                ctx.beginPath();
                ctx.arc(150, 100, 60, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = '60px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🦎', 150, 120);

                ctx.font = 'bold 18px sans-serif';
                ctx.fillStyle = 'white';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 3;

                ctx.strokeText(topText.toUpperCase(), 150, 35);
                ctx.fillText(topText.toUpperCase(), 150, 35);

                ctx.strokeText(bottomText.toUpperCase(), 150, 180);
                ctx.fillText(bottomText.toUpperCase(), 150, 180);
            }, [isOpen, topText, bottomText]);

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[5000] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className={`${themeStyles.modalBg} border rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl transition-colors`}>

                            </button>
                        </div>
                        <canvas ref={canvasRef} width="300" height="200" className="mx-auto rounded-xl border border-slate-700 shadow-lg mb-4"></canvas>
                        <div className="space-y-2 mb-4">
                            <input 
                                type="text" 
                                value={topText} 
                                onChange={(e) => setTopText(e.target.value)}
                                placeholder="Top Caption"
                                className={`w-full rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan-400 border ${themeStyles.inputBg}`}
                            />
                            <input

                            />

                        >
                            Post Meme to Feed

                    </div>

                                                    ))}
                                                </div>

                                                <div className="bg-gradient-to-r from-amber-950/60 to-slate-900 border border-amber-500/30 rounded-xl p-3 text-xs text-center text-white">
                                                    <span className="opacity-80">Total Expenses: </span>
                                                    <span className="font-bold text-amber-400 text-sm">₱{totalTripExpense.toLocaleString()}</span>
                                                    <div className="mt-1 font-semibold">
                                                        Equal Share (6 Trekkers): <span className="text-emerald-400">₱{Math.round(totalTripExpense / 6).toLocaleString()} / person</span>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {/* TAB 6: CAREGIVER PATIENT VITALS LOG */}
                                        {activeTab === 'vitals' && (
                                            <div className="space-y-3">
                                                <form onSubmit={handleAddVitalLog} className="flex gap-2 text-xs">
                                                    <select 
                                                        value={newVitalMetric}
                                                        onChange={(e) => setNewVitalMetric(e.target.value)}
                                                        className={`border rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-cyan-400 ${themeStyles.inputBg}`}
                                                    >
                                                        <option value="Blood Pressure">Blood Pressure</option>
                                                        <option value="Blood Glucose">Blood Glucose</option>
                                                        <option value="Pulse Rate">Pulse Rate</option>
                                                    </select>
                                                    <input 
                                                        type="text" 
                                                        value={newVitalValue}
                                                        onChange={(e) => setNewVitalValue(e.target.value)}
                                                        placeholder="Value (e.g. 120/80)"
                                                        className={`flex-1 border rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-cyan-400 ${themeStyles.inputBg}`}
                                                    />
                                                    <button type="submit" className="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-xl font-bold shadow">
                                                        + Log
                                                    </button>
                                                </form>

                                                <div className="space-y-2 max-h-64 overflow-y-auto">
                                                    {vitalsLogs.map(v => (
                                                        <div key={v.id} className={`border rounded-xl p-3 flex items-center justify-between text-xs ${themeStyles.cardBg}`}>
                                                            <div>
                                                                <span className={`text-[10px] font-semibold ${themeStyles.secondaryText}`}>{v.time}</span>
                                                                <h4 className={`font-bold ${themeStyles.textPrimary}`}>{v.metric}</h4>
                                                            </div>
                                                            <div className="text-right">
                                                                <span className="font-bold text-pink-400 text-sm">{v.value}</span>
                                                                <div className="text-[10px] text-emerald-400 font-bold">{v.status}</div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* TAB 7: IN-CHAT MEME GENERATOR */}
                                        {activeTab === 'meme' && (
                                            <div className={`border rounded-2xl p-6 text-center space-y-3 ${themeStyles.subPanelBg}`}>
                                                <div className="w-16 h-16 rounded-full bg-blue-600/20 border border-blue-500/30 text-cyan-400 flex items-center justify-center text-2xl mx-auto">
                                                    🎨
                                                </div>
                                                <h4 className={`font-bold text-sm ${themeStyles.textPrimary}`}>In-Chat Meme Express Generator</h4>
                                                <p className={`text-xs ${themeStyles.secondaryText}`}>Create custom captioned memes and post directly to the Cebu Creative Lounge feed!</p>
                                                <button 
                                                    onClick={() => { audioSynth.playDialClick(); setIsMemeModalOpen(true); }}
                                                    className="bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-lg shadow-cyan-500/20 transition"
                                                >
                                                    Open Meme Canvas
                                                </button>
                                            </div>
                                        )}

                                        {/* TAB 8: FAMILY STATUS CHECK-INS */}
                                        {activeTab === 'checkin' && (
                                            <div className="space-y-3">
                                                <div className="flex gap-2">
                                                    <button onClick={() => handleAddCheckin('At Home')} className="flex-1 bg-emerald-600/30 border border-emerald-500 text-emerald-300 py-1.5 rounded-xl text-xs font-bold shadow">🏡 At Home</button>
                                                    <button onClick={() => handleAddCheckin('At School')} className="flex-1 bg-blue-600/30 border border-blue-500 text-blue-300 py-1.5 rounded-xl text-xs font-bold shadow">🎓 At School</button>
                                                    <button onClick={() => handleAddCheckin('In Transit')} className="flex-1 bg-amber-600/30 border border-amber-500 text-amber-300 py-1.5 rounded-xl text-xs font-bold shadow">🚗 In Transit</button>
                                                </div>
                                                <div className="space-y-2 max-h-64 overflow-y-auto">
                                                    {checkinLogs.map(item => (
                                                        <div key={item.id} className={`border rounded-xl p-3 flex justify-between items-center text-xs ${themeStyles.cardBg}`}>
                                                            <div>
                                                                <h4 className={`font-bold ${themeStyles.textPrimary}`}>{item.name}</h4>
                                                                <span className={`text-[10px] ${themeStyles.secondaryText}`}>{item.location} · {item.time}</span>
                                                            </div>
                                                            <span className="bg-amber-950 text-amber-400 border border-amber-800 px-2 py-0.5 rounded-md font-bold text-[10px]">
                                                                {item.status}
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* TAB 9: MEDICATION SCHEDULE */}
                                        {activeTab === 'meds' && (
                                            <div className="space-y-2">
                                                {medsList.map(med => (
                                                    <div key={med.id} className={`border rounded-xl p-3 flex justify-between items-center text-xs ${themeStyles.cardBg}`}>
                                                        <div>
                                                            <span className={`text-[10px] font-semibold ${themeStyles.secondaryText}`}>{med.time}</span>
                                                            <h4 className={`font-bold ${themeStyles.textPrimary}`}>{med.name} ({med.dosage})</h4>
                                                        </div>
                                                        <button 
                                                            onClick={() => handleToggleMed(med.id)}
                                                            className={`px-3 py-1 rounded-lg font-bold text-xs ${med.taken ? 'bg-emerald-600 text-white' : themeStyles.pillInactive}`}
                                                        >
                                                            {med.taken ? '✓ Taken' : 'Mark Taken'}
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {/* TAB 10: CRISIS EMERGENCY SOS DISPATCH COMMAND */}
                                        {activeTab === 'sos' && (
                                            <div className={`border border-red-500/50 rounded-2xl p-4 text-center space-y-3 ${themeStyles.subPanelBg}`}>
                                                <div className="w-14 h-14 rounded-full bg-red-600/20 text-red-400 border border-red-500 flex items-center justify-center text-2xl mx-auto animate-pulse">
                                                    🚨
                                                </div>
                                                <h4 className={`font-bold text-sm ${themeStyles.textPrimary}`}>Emergency SOS Dispatch Command</h4>
                                                <p className={`text-xs ${themeStyles.secondaryText}`}>Geofenced panic beacons transmit GPS telemetry to first responder triage command.</p>
                                                <button 
                                                    onClick={() => { audioSynth.playPttBeep(); setSosAlertActive(!sosAlertActive); }}
                                                    className={`px-4 py-2 rounded-xl text-xs font-bold transition shadow-lg ${sosAlertActive ? 'bg-red-600 text-white' : 'bg-red-500/20 text-red-400 border border-red-500/40'}`}
                                                >
                                                    {sosAlertActive ? 'Deactivate Broadcast' : 'Broadcast SOS Triage Beacon'}
                                                </button>
                                            </div>
                                        )}

                                        {/* TAB 11: ACADEMIC SUBMISSIONS / DOCS */}
                                        {activeTab === 'docs' && (
                                            <div className="space-y-2">
                                                {docsList.map(doc => (
                                                    <div key={doc.id} className={`border rounded-xl p-3 flex justify-between items-center text-xs ${themeStyles.cardBg}`}>
                                                        <div className="flex items-center space-x-2.5">
                                                            <i className="fa-solid fa-file-pdf text-red-400 text-base"></i>
                                                            <div>
                                                                <h4 className={`font-bold ${themeStyles.textPrimary}`}>{doc.title}</h4>
                                                                <span className={`text-[10px] ${themeStyles.secondaryText}`}>{doc.author} · {doc.size}</span>
                                                            </div>
                                                        </div>
                                                        <button onClick={() => { audioSynth.playDialClick(); alert(`Downloading ${doc.title}...`); }} className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-2.5 py-1 rounded-lg text-xs shadow">
                                                            Download
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {/* TAB 12: ANALYTICS / MEDIA SHOWCASE */}
                                        {(activeTab === 'analytics' || activeTab === 'gallery') && (
                                            <div className={`border rounded-2xl p-4 text-center space-y-2 text-xs ${themeStyles.subPanelBg}`}>
                                                <i className="fa-solid fa-chart-line text-cyan-400 text-3xl mb-1"></i>
                                                <h4 className={`font-bold text-sm ${themeStyles.textPrimary}`}>{activeWs.name} Telemetry Summary</h4>
                                                <p className={themeStyles.secondaryText}>Real-time telemetry and workspace activity metrics synced with GCash Chameleon Core.</p>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* ROSTER VIEW (IF ROSTER TAB SELECTED) */}
                            {}
                            {mobileNavTab === 'roster' && (
                                <div className={`p-4 flex-1 overflow-y-auto space-y-3 ${themeStyles.frameBg}`}>
                                    <h3 className={`text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 ${themeStyles.secondaryText}`}>
                                        <i className="fa-solid fa-users text-blue-500"></i>
                                        Workspace Roster ({activeWs?.name})
                                    </h3>

                                    {/* Add Member Form */}
                                    {activeWsId && (
                                        <form onSubmit={handleAddMember} className="flex gap-2 text-xs mb-3">
                                            <input 
                                                type="text" 
                                                value={newMemberName}
                                                onChange={(e) => setNewMemberName(e.target.value)}
                                                placeholder="Member Name"
                                                className={`flex-1 border rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-cyan-400 ${themeStyles.inputBg}`}
                                            />
                                            <input 
                                                type="text" 
                                                value={newMemberRole}
                                                onChange={(e) => setNewMemberRole(e.target.value)}
                                                placeholder="Role Label"
                                                className={`w-28 border rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-cyan-400 ${themeStyles.inputBg}`}
                                            />
                                            <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-xl shadow">
                                                + Add
                                            </button>
                                        </form>
                                    )}

                                    <div className="space-y-2">
                                        {(membersByWs[activeWsId] || [
                                            { id: 'u1', name: 'Mark Admin', handle: '@mark', role: 'ADMIN', isYou: true }
                                        ]).map(m => (
                                            <div key={m.id} className={`border rounded-xl p-3 flex items-center justify-between text-xs ${themeStyles.cardBg}`}>
                                                <div className="flex items-center space-x-2.5">
                                                    <div className="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold shadow">
                                                        {m.name.charAt(0)}
                                                    </div>
                                                    <div>
                                                        <h4 className={`font-bold ${themeStyles.textPrimary}`}>{m.name} {m.isYou && '(You)'}</h4>
                                                        <span className={`text-[10px] ${themeStyles.secondaryText}`}>{m.handle}</span>
                                                    </div>
                                                </div>
                                                <span className="text-[10px] font-bold bg-blue-950 text-cyan-400 border border-cyan-800 px-2 py-1 rounded-md">
                                                    {m.role}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* GCash-Style Bottom Navigation Dock Bar */}
                            {}
                            <div className={`border-t p-2 flex items-center justify-around z-40 ${themeStyles.dockBg}`}>
                                <button 
                                    onClick={() => { audioSynth.playDialClick(); setMobileNavTab('home'); }}
                                    className={`flex flex-col items-center text-[10px] font-bold transition ${mobileNavTab === 'home' ? themeStyles.dockTextActive : themeStyles.dockTextInactive}`}
                                >
                                    <i className="fa-solid fa-house text-base mb-0.5"></i>
                                    <span>Workspaces</span>
                                </button>
                                <button 
                                    onClick={() => { audioSynth.playDialClick(); setMobileNavTab('workspace_tools'); }}
                                    className={`flex flex-col items-center text-[10px] font-bold transition ${mobileNavTab === 'workspace_tools' ? themeStyles.dockTextActive : themeStyles.dockTextInactive}`}
                                >
                                    <i className="fa-solid fa-toolbox text-base mb-0.5"></i>
                                    <span>Tools</span>
                                </button>
                                <button 
                                    onClick={() => { audioSynth.playDialClick(); setMobileNavTab('roster'); }}
                                    className={`flex flex-col items-center text-[10px] font-bold transition ${mobileNavTab === 'roster' ? themeStyles.dockTextActive : themeStyles.dockTextInactive}`}
                                >
                                    <i className="fa-solid fa-users text-base mb-0.5"></i>
                                    <span>Roster</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* FULL-SCREEN MOBILE CALLING OVERLAY */}
                    {}
                    {isCallActive && (
                        <div className="fixed inset-0 z-[6000] bg-slate-950/95 backdrop-blur-2xl flex flex-col items-center justify-between p-6 text-white">
                            <div className="text-center space-y-1 mt-6">
                                <div className="text-xs font-bold uppercase tracking-widest text-cyan-400 flex items-center justify-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                                    {callMode === 'VOICE' ? 'Full-Duplex Encrypted Voice Call' : 'Full-HD Video Stream Call'}
                                </div>
                                <h2 className="text-2xl font-black text-white">{activeWs ? activeWs.name : 'Chameleon Call'}</h2>
                                <p className="text-xs text-slate-400">{formatTime(callTimer)}</p>
                            </div>

                            <div className="relative my-auto flex flex-col items-center justify-center">
                                {callMode === 'VIDEO' ? (
                                    <div className="w-64 h-80 bg-slate-900 border-2 border-cyan-500/50 rounded-3xl overflow-hidden relative shadow-2xl flex items-center justify-center">
                                        <div className="text-slate-500 text-center p-4">
                                            <i className="fa-solid fa-video text-4xl mb-2 text-cyan-400"></i>
                                            <p className="text-xs">Webcam Stream Active</p>
                                        </div>
                                        <div className="absolute bottom-3 right-3 w-20 h-28 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center text-lg">
                                            👤
                                        </div>
                                    </div>
                                ) : (
                                    <div className="relative">
                                        <div className="w-36 h-36 rounded-full bg-gradient-to-tr from-blue-600 to-cyan-400 p-1 animate-ripple shadow-2xl">
                                            <div className="w-full h-full rounded-full bg-slate-900 flex items-center justify-center text-5xl">
                                                👤
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="w-full max-w-sm bg-slate-900/90 border border-slate-800 rounded-3xl p-4 flex items-center justify-around shadow-2xl mb-4">
                                <button 
                                    onClick={() => { audioSynth.playDialClick(); setIsMuted(!isMuted); }}
                                    className={`w-12 h-12 rounded-2xl flex items-center justify-center text-lg transition ${isMuted ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-white hover:bg-slate-700'}`}
                                    title="Toggle Mute"
                                >
                                    <i className={`fa-solid ${isMuted ? 'fa-microphone-slash' : 'fa-microphone'}`}></i>
                                </button>

                                {callMode === 'VIDEO' && (
                                    <button 
                                        onClick={() => { audioSynth.playDialClick(); setIsVideoMuted(!isVideoMuted); }}
                                        className={`w-12 h-12 rounded-2xl flex items-center justify-center text-lg transition ${isVideoMuted ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-white hover:bg-slate-700'}`}
                                        title="Toggle Camera"
                                    >
                                        <i className={`fa-solid ${isVideoMuted ? 'fa-video-slash' : 'fa-video'}`}></i>
                                    </button>
                                )}

                                <button 
                                    onClick={() => {
                                        audioSynth.playPttBeep();
                                        setIsCallActive(false);
                                    }}
                                    className="w-14 h-14 rounded-full bg-red-600 hover:bg-red-500 text-white flex items-center justify-center text-xl shadow-lg shadow-red-600/40 transition transform active:scale-95"
                                    title="End Call"
                                >
                                    <i className="fa-solid fa-phone-slash"></i>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* IN-CHAT MEME GENERATOR MODAL */}
                    <MemeModal 
                        isOpen={isMemeModalOpen} 
                        onClose={() => setIsMemeModalOpen(false)} 
                        themeStyles={themeStyles}
                        onSendMeme={(memeText) => {
                            if (activeWsId) {
                                const newMsg = {
                                    id: 'meme_' + Date.now(),
                                    sender: 'You (Meme Express)',
                                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                                    text: memeText
                                };
                                setMessagesByWs(prev => ({
                                    ...prev,
                                    [activeWsId]: [...(prev[activeWsId] || []), newMsg]
                                }));
                            }
                        }}
                    />
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
